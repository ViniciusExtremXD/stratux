name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Domínio próprio configurado (public/CNAME): serve na raiz de
      # www.stratuxconsultoria.com.br, não em /<repo>/. Se o domínio for
      # removido, volte BASE_PATH para /${{ github.event.repository.name }}
      # e SITE_URL para https://${{ github.repository_owner }}.github.io.
      - name: Build
        env:
          BASE_PATH: /
          SITE_URL: https://www.stratuxconsultoria.com.br
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
